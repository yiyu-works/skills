<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>滚动与阅读进度 · 动效示例</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#183d30;font:20px/1.8 system-ui}.progress{height:5px;background:#183d30;position:fixed;top:0;left:0;right:0;transform:scaleX(0);transform-origin:left;z-index:2}main{max-width:850px;margin:auto;padding:0 24px}section{min-height:90vh;padding:120px 0;display:flex;flex-direction:column;justify-content:center}h1,h2{font-size:clamp(32px,6vw,60px);line-height:1.2}.reveal{opacity:1;transform:none}.enhanced .reveal.pending{opacity:0;transform:translateY(24px)}.enhanced .reveal{transition:opacity .5s ease,transform .5s ease}.card{padding:32px;border:1px solid #183d30;border-radius:12px}@media(prefers-reduced-motion:reduce){.enhanced .reveal.pending{opacity:1;transform:none}.enhanced .reveal{transition:none}.progress{display:none}}</style></head><body><div class="progress" aria-hidden="true"></div><main><section><h1>让动作服务于理解</h1><p>内容默认可见。滚动出场与连续阅读进度分别处理，不需要劫持页面滚动。</p></section><section><div class="reveal card"><h2>在需要时出现</h2><p>观察元素进入视口，再执行一次轻量出场；不让动画阻挡阅读。</p></div></section><section><div class="reveal"><h2>减少动效，内容仍完整</h2><p>操作系统启用减少动态效果时，页面直接呈现内容。关闭 JavaScript 也可以阅读。</p></div></section></main><script>(()=>{const media=matchMedia('(prefers-reduced-motion: reduce)'),elements=[...document.querySelectorAll('.reveal')],bar=document.querySelector('.progress');let observer,frame=0;function update(){frame=0;const length=document.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${length>0?Math.min(1,Math.max(0,scrollY/length)):0})`}function schedule(){if(!frame&&!document.hidden&&!media.matches)frame=requestAnimationFrame(update)}function configure(){observer?.disconnect();elements.forEach(e=>e.classList.remove('pending'));document.documentElement.classList.remove('enhanced');if(media.matches){bar.style.transform='scaleX(0)';if(frame)cancelAnimationFrame(frame);frame=0;return}if('IntersectionObserver'in window){observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.remove('pending');observer.unobserve(entry.target)}}),{threshold:.1});document.documentElement.classList.add('enhanced');elements.forEach(e=>{e.classList.add('pending');observer.observe(e)})}schedule()}function visibility(){if(document.hidden&&frame){cancelAnimationFrame(frame);frame=0}else schedule()}addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);document.addEventListener('visibilitychange',visibility);media.addEventListener('change',configure);addEventListener('pagehide',()=>{observer?.disconnect();if(frame)cancelAnimationFrame(frame);removeEventListener('scroll',schedule);removeEventListener('resize',schedule);document.removeEventListener('visibilitychange',visibility);media.removeEventListener('change',configure)});configure()})()</script></body></html>
