<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>从想法到作品 · 示例演示</title><style>*{box-sizing:border-box}body{margin:0;background:#e3e6db;color:#183d30;font:20px/1.6 system-ui}.deck{max-width:1200px;margin:32px auto;padding:0 20px}.slide{padding:6%;aspect-ratio:16/9;background:#f4f2eb;display:none;border:1px solid #ccd4c4}.slide.active{display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(30px,5vw,64px);line-height:1.15;margin:0 0 24px}h2{font-size:clamp(26px,4vw,48px);line-height:1.2}.eyebrow{letter-spacing:.12em;font-size:14px}p,li{max-width:850px}.notes{display:none;background:#fff;padding:20px;font-size:16px}.notes.visible{display:block}.controls{display:flex;align-items:center;gap:16px;justify-content:center;padding:20px;flex-wrap:wrap}button{font:inherit;padding:8px 16px;border:1px solid #183d30;background:#f4f2eb;color:inherit;border-radius:6px}button:disabled{opacity:.4}@media(max-width:600px){body{font-size:17px}.slide{aspect-ratio:auto;min-height:60vh;padding:28px}.deck{margin:16px auto}}@media print{@page{size:landscape;margin:10mm}body{background:white;font-size:18px}.deck{max-width:none;padding:0;margin:0}.slide,.slide.active{display:flex;aspect-ratio:auto;min-height:160mm;justify-content:center;break-after:page;border:0;background:white;padding:10mm}.slide:last-child{break-after:auto}.notes,.notes.visible,.controls{display:none!important}h1{font-size:48px}h2{font-size:36px}}</style></head><body>
<main class="deck" aria-label="演示文稿">
<section class="slide active" aria-label="第1页"><p class="eyebrow">YIYU WORKS / 示例</p><h1>把经验写成工作流</h1><p>从一个具体任务开始，让成果可复现、可编辑、可继续使用。</p><aside class="notes">开场说明：这是可编辑模板，不是已发布产品的宣传材料。</aside></section>
<section class="slide" aria-label="第2页"><h2>先完成一个真实任务</h2><ol><li>明确输入资料与用户目标。</li><li>制作可修改的成果。</li><li>检查实际行为并记录限制。</li></ol><aside class="notes">讲述一个有输入、有输出的具体例子。</aside></section>
<section class="slide" aria-label="第3页"><h2>用结果决定下一步</h2><p>记录安装、运行、修改与交付过程中发生的问题，再扩展下一项能力。</p><aside class="notes">不要承诺尚未测试的效果或终身维护。</aside></section>
</main><nav class="controls" aria-label="演示控制"><button id="prev">上一页</button><span id="count" aria-live="polite"></span><button id="next">下一页</button><button id="notes" aria-pressed="false">备注（N）</button></nav>
<script>(()=>{const slides=[...document.querySelectorAll('.slide')];let current=0,notes=false;function show(){slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.querySelector('.notes')?.classList.toggle('visible',notes)});document.querySelector('#count').textContent=`${current+1} / ${slides.length}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('#notes').setAttribute('aria-pressed',String(notes))}function move(n){current=Math.max(0,Math.min(slides.length-1,n));show()}function toggle(){notes=!notes;show()}document.querySelector('#prev').onclick=()=>move(current-1);document.querySelector('#next').onclick=()=>move(current+1);document.querySelector('#notes').onclick=toggle;document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();move(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();move(current-1)}else if(e.key==='Home'){e.preventDefault();move(0)}else if(e.key==='End'){e.preventDefault();move(slides.length-1)}else if(e.key.toLowerCase()==='n')toggle()});show()})()</script></body></html>
